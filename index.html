<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5EFE4" />
    <meta name="description" content="Kho Nhỏ — trò chơi xếp thùng hàng ấm cúng." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='5' fill='%23B97B46' stroke='%237A4E2A' stroke-width='2'/%3E%3Cpath d='M9 9l14 14M23 9L9 23' stroke='%237A4E2A' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Kho Nhỏ</title>
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <div class="hud__title">
          <p class="hud__brand">Kho Nhỏ</p>
          <h1 class="hud__level"><span id="level-number"></span> <span class="hud__sep" aria-hidden="true">·</span> <span id="level-name"></span></h1>
        </div>
        <dl class="hud__stats">
          <div class="stat"><dt>Bước</dt><dd id="moves">0</dd></div>
          <div class="stat"><dt>Đẩy</dt><dd id="pushes">0</dd></div>
        </dl>
      </header>

      <main class="stage">
        <div id="board" class="board" role="img" aria-label="Bàn chơi"></div>
        <p id="status" class="status" hidden></p>
      </main>

      <section class="controls" aria-label="Điều khiển">
        <div class="actions">
          <button type="button" class="btn btn--action" data-command="undo">
            <span class="btn__icon" aria-hidden="true">↶</span><span>Hoàn tác</span>
          </button>
          <button type="button" class="btn btn--action" data-command="restart">
            <span class="btn__icon" aria-hidden="true">⟲</span><span>Chơi lại</span>
          </button>
        </div>
        <div class="dpad" role="group" aria-label="Di chuyển">
          <button type="button" class="btn btn--dir dpad__up" data-command="move" data-direction="up" aria-label="Lên">▲</button>
          <button type="button" class="btn btn--dir dpad__left" data-command="move" data-direction="left" aria-label="Trái">◀</button>
          <button type="button" class="btn btn--dir dpad__right" data-command="move" data-direction="right" aria-label="Phải">▶</button>
          <button type="button" class="btn btn--dir dpad__down" data-command="move" data-direction="down" aria-label="Xuống">▼</button>
        </div>
        <p class="hint">Phím mũi tên hoặc W A S D để đi · Z để hoàn tác · R để chơi lại</p>
      </section>
    </div>

    <dialog id="completion" class="dialog" aria-labelledby="completion-title">
      <h2 id="completion-title" class="dialog__title">Hoàn thành!</h2>
      <p>Mọi thùng hàng đã về đúng chỗ.</p>
      <dl class="dialog__stats">
        <div class="stat"><dt>Bước</dt><dd id="completion-moves">0</dd></div>
        <div class="stat"><dt>Đẩy</dt><dd id="completion-pushes">0</dd></div>
      </dl>
      <p class="dialog__note">Bạn có thể đóng bảng này để xem lại bàn chơi hoặc hoàn tác nước đi cuối.</p>
      <div class="dialog__actions">
        <button type="button" class="btn btn--primary" data-dialog="replay">Chơi lại màn này</button>
        <button type="button" class="btn" data-dialog="close">Xem bàn chơi</button>
      </div>
    </dialog>

    <div id="announcer" class="sr-only" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
